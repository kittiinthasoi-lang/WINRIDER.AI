name: WIN Alert Event Sync

on:
  schedule:
    - cron: "37 */2 * * *"
      timezone: "Asia/Bangkok"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync multi-source event intelligence
        env:
          WINRIDER_APP_URL: ${{ vars.WINRIDER_APP_URL }}
          WIN_ALERT_INTERNAL_SYNC_SECRET: ${{ secrets.WIN_ALERT_INTERNAL_SYNC_SECRET }}
          TAT_INTERNAL_SYNC_SECRET: ${{ secrets.TAT_INTERNAL_SYNC_SECRET }}
        run: |
          set -euo pipefail
          secret="${WIN_ALERT_INTERNAL_SYNC_SECRET:-${TAT_INTERNAL_SYNC_SECRET:-}}"
          if [ -z "${WINRIDER_APP_URL:-}" ] || [ -z "${secret}" ]; then
            echo "WINRIDER_APP_URL or WIN Alert sync secret is not configured; skipping scheduled sync."
            exit 0
          fi
          curl --fail-with-body --silent --show-error             --request POST             --header "x-winrider-event-sync-secret: ${secret}"             --header "Accept: application/json"             --max-time 300             "${WINRIDER_APP_URL%/}/api/internal/events/sync"
