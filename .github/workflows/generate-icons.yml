  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: |
      npm ci || npm install

  - name: Run icon generator
    run: |
      if [ -f "scripts/generate-icons.ts" ]; then
        npx ts-node scripts/generate-icons.ts
      elif [ -f "scripts/generate-icons.js" ]; then
        node scripts/generate-icons.js
      else
        echo "No generator script found"
        exit 1
      fi

  - name: Commit and push generated assets
    uses: stefanzweifel/git-auto-commit-action@v4
    with:
      commit_message: "chore: generate icons from source logo [skip ci]"
      branch: replace-logo
      file_pattern: |
        public/**
        assets/icons/**
