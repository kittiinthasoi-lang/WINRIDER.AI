name: Firestore Rules Emulator

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/rules/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - tests/rules/**
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund
      - name: Run Firestore emulator security tests
        working-directory: tests/rules
        run: npx firebase emulators:exec --config ../../firebase.json --project demo-winrider-rules --only firestore "npm test"
