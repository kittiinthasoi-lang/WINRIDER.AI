<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="relBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1202" />
      <stop offset="50%" stop-color="#2D1F03" />
      <stop offset="100%" stop-color="#100B00" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D49A00" />
    </linearGradient>
    <filter id="goldAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="24" cy="24" r="22" fill="url(#relBg)" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.7" />
  
  <!-- Sacred Halo Radiance -->
  <circle cx="24" cy="24" r="17" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />
  
  <!-- Radiant Rays -->
  <line x1="24" y1="5" x2="24" y2="8" stroke="#FFE066" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="40" x2="24" y2="43" stroke="#FFE066" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="5" y1="24" x2="8" y2="24" stroke="#FFE066" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="40" y1="24" x2="43" y2="24" stroke="#FFE066" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="10.5" y1="10.5" x2="13" y2="13" stroke="#FFE066" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  <line x1="37.5" y1="10.5" x2="35" y2="13" stroke="#FFE066" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

  <!-- Sacred Stupa / Chedi & Temple Spire -->
  <!-- Spire Peak & Chatra -->
  <circle cx="24" cy="11" r="1.5" fill="#FFE066" filter="url(#goldAura)" />
  <line x1="24" y1="12.5" x2="24" y2="17" stroke="url(#goldGlow)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Tiered Spire Ringlets -->
  <path d="M22 17 H26" stroke="#FFD700" stroke-width="1.2" stroke-linecap="round" />
  <path d="M21 19 H27" stroke="#FFD700" stroke-width="1.2" stroke-linecap="round" />
  <path d="M20 21 H28" stroke="#FFD700" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Bell Dome (Anda) -->
  <path d="M19 28 C18 24 20 22 24 22 C28 22 30 24 29 28 Z" fill="url(#goldGlow)" />
  
  <!-- Dharma Wheel / Sacred Core in Bell -->
  <circle cx="24" cy="25.5" r="2.2" fill="#1A1202" stroke="#FFE066" stroke-width="0.8" />
  
  <!-- Multi-Tier Base Pedestal -->
  <rect x="17" y="28" width="14" height="2.5" rx="1" fill="#FFC700" />
  <rect x="15" y="31.5" width="18" height="3" rx="1" fill="url(#goldGlow)" />
  <rect x="13" y="35" width="22" height="2.5" rx="1" fill="#D49A00" opacity="0.8" />
</svg>
