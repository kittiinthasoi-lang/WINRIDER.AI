<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="vcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021024" />
      <stop offset="50%" stop-color="#052445" />
      <stop offset="100%" stop-color="#001220" />
    </linearGradient>
    <linearGradient id="vcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="vcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Disc -->
  <circle cx="24" cy="24" r="22" fill="url(#vcBg)" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="24" cy="24" r="18" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.4" />
  
  <!-- Left Sound Waves -->
  <path d="M12 21 C12 21 10 22.5 10 24 C10 25.5 12 27 12 27" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <path d="M15 18 C15 18 12 21 12 24 C12 27 15 30 15 30" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Right Sound Waves -->
  <path d="M33 18 C33 18 36 21 36 24 C36 27 33 30 33 30" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M36 21 C36 21 38 22.5 38 24 C38 25.5 36 27 36 27" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Center Microphone Body -->
  <rect x="20" y="14" width="8" height="13" rx="4" fill="url(#vcCyan)" filter="url(#vcGlow)" />
  <path d="M20 20 H28" stroke="#021024" stroke-width="1" opacity="0.7" />
  
  <!-- Microphone Stand Bracket -->
  <path d="M17 22 C17 26.5 20 29.5 24 29.5 C28 29.5 31 26.5 31 22" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <line x1="24" y1="29.5" x2="24" y2="34" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" />
  <line x1="19" y1="34" x2="29" y2="34" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" />
</svg>
